refresh:
  name: Refresh
  description: Liest UniFi-Clients und HA-Devices neu ein und aktualisiert sensor.uniali_aliases.

sync_unifi:
  name: Sync HA → UniFi
  description: Schreibt den HA-Friendly-Name als UniFi-Client-Alias für die angegebene MAC.
  fields:
    mac:
      name: MAC
      description: MAC-Adresse des Ziel-Geräts (z.B. cc:ba:97:dd:12:dc).
      required: true
      selector:
        text:

sync_device:
  name: Sync HA → Gerät
  description: Schreibt den HA-Friendly-Name als geräteinternen Namen via Vendor-Adapter (z.B. Shelly-RPC).
  fields:
    mac:
      name: MAC
      description: MAC-Adresse des Ziel-Geräts.
      required: true
      selector:
        text:

sync_hostname:
  name: Sync HA → UniFi-Hostname + DNS
  description: >-
    Setzt den Hostnamen des Clients in UniFi UND einen lokalen DNS-Record
    `<name>.<domain>`; ist noch keine DHCP-Reservation vorhanden, wird sie
    dafür angelegt (UniFi verlangt sie für DNS-Records). Ohne `hostname` ist
    die Quelle der HA-Name (klein, DNS-tauglich normalisiert); mit `hostname`
    wird ein freier Wert gesetzt — der Weg für Clients ohne HA-Gerät.
    Der Hostname allein hält nicht: meldet das Gerät per DHCP seinen eigenen
    Namen (Shelly, ESPHome, Protect-Kameras), überschreibt UniFi ihn beim
    nächsten Lease. Der DNS-Record bleibt.
  fields:
    mac:
      name: MAC
      description: MAC-Adresse des Ziel-Geräts.
      required: true
      selector:
        text:
    hostname:
      name: Hostname
      description: >-
        Freier Zielwert. Wird DNS-tauglich normalisiert (klein, Umlaute
        ausgeschrieben, Trenner zu "-"). Leer lassen, um den HA-Namen zu
        verwenden.
      required: false
      example: prusa-cam-01
      selector:
        text:

forget_unifi:
  name: UniFi-Client vergessen
  description: >-
    Lässt UniFi den Client komplett vergessen. Verliert: Alias, Fixed-IP,
    User-Group, Block-Status, Stats. Beim nächsten Reconnect entsteht ein
    frischer Eintrag ohne Pflege. Für Karteileichen-Cleanup.
  fields:
    mac:
      name: MAC
      description: MAC-Adresse des zu vergessenden Clients.
      required: true
      selector:
        text:

set_ignore:
  name: Zeile stummschalten
  description: >-
    Nimmt eine Zeile aus Mismatch-Zähler und Mismatch-Filter (oder holt sie
    zurück). Die Zeile bleibt sichtbar — für Abweichungen, die man kennt und
    bewusst stehen lässt.
  fields:
    mac:
      name: MAC
      description: MAC-Adresse der Zeile.
      required: true
      selector:
        text:
    ignore:
      name: Stummschalten
      description: true = ignorieren, false = wieder mitzählen.
      required: true
      selector:
        boolean:
